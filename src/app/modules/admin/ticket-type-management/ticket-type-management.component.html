<div class="space-y-6">
  <!-- Encabezado -->
  <header class="page-head flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="page-head__icono p-2.5 rounded-xl bg-primary/10 text-primary" aria-hidden="true">
        <i class="fa-solid fa-tag text-2xl"></i>
      </div>
      <div>
        <h1 class="page-head__titulo text-2xl sm:text-3xl font-bold text-primary">Tipos de ticket</h1>
        <p class="text-sm opacity-70">Clasificación de tickets: incidentes, requerimientos, consultas y proyectos</p>
      </div>
    </div>

    <button class="btn btn-primary btn-sm gap-2" (click)="showCreate = !showCreate">
      <i class="fa-solid fa-plus text-[15px]" aria-hidden="true"></i>
      {{ showCreate ? 'Cancelar' : 'Nuevo tipo' }}
    </button>
  </header>

<!-- Formulario de creación -->
  <div *ngIf="showCreate" class="card bg-base-100 shadow-md border border-base-200">
    <div class="card-body">
      <div class="flex flex-wrap gap-3 items-end">
        <label class="form-control w-full sm:flex-1">
          <div class="label pt-0 pb-1"><span class="label-text text-xs font-medium">Nombre <span class="text-error">*</span></span></div>
          <input [(ngModel)]="newType.name" class="input input-bordered input-sm w-full" placeholder="Ej. INCIDENTE" maxlength="50" />
        </label>
        <label class="form-control w-full sm:flex-[2]">
          <div class="label pt-0 pb-1"><span class="label-text text-xs font-medium">Descripción</span></div>
          <input [(ngModel)]="newType.description" class="input input-bordered input-sm w-full" placeholder="Descripción breve del tipo" maxlength="255" />
        </label>
        <label class="form-control w-full sm:w-56">
          <div class="label pt-0 pb-1"><span class="label-text text-xs font-medium">Icono (Font Awesome)</span></div>
          <input [(ngModel)]="newType.icon" class="input input-bordered input-sm w-full font-mono" placeholder="fa-solid fa-tag" />
        </label>
        <label class="form-control w-full sm:w-40">
          <div class="label pt-0 pb-1"><span class="label-text text-xs font-medium">Color</span></div>
          <div class="flex items-center gap-2">
            <input type="color" [(ngModel)]="newType.color"
              class="w-9 h-8 cursor-pointer rounded-lg border border-base-300 p-0.5 shrink-0"
              aria-label="Color del tipo" />
            <input [(ngModel)]="newType.color" class="input input-bordered input-sm w-full font-mono" />
          </div>
        </label>
        <button class="btn btn-primary btn-sm gap-2" (click)="create()" [disabled]="!newType.name?.trim()">
<i class="fa-solid fa-check text-[15px]" aria-hidden="true"></i>
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- Listado -->
  <div class="card bg-base-100 shadow-md border border-base-200">
    <div class="card-body">
      <div *ngIf="loading" class="flex justify-center py-10">
        <span class="loading loading-spinner loading-lg text-primary" aria-hidden="true"></span>
      </div>

      <div *ngIf="!loading" class="overflow-x-auto rounded-xl border border-base-200">
        <table class="table table-sm table-zebra">
          <thead class="bg-primary text-white">
            <tr>
              <th class="text-center">Nombre</th>
              <th class="text-center">Color</th>
              <th class="text-center">Descripción</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let t of pagTipos.vista">
              <!-- Fila en edición -->
              <ng-container *ngIf="editType?.id === t.id; else readonlyRow">
                <td>
                  <input [(ngModel)]="editType!.name" class="input input-bordered input-xs w-full" maxlength="50" />
                </td>
                <td>
                  <div class="flex gap-2 items-center">
                    <span class="p-1 rounded shrink-0 flex items-center justify-center"
                      [style.background-color]="(editType!.color || '#2563EB') + '20'"
                      [style.color]="editType!.color || '#2563EB'"
                      aria-hidden="true">
                      <i [class]="editType!.icon || 'fa-solid fa-tags'" class="text-xs"></i>
                    </span>
                    <input [(ngModel)]="editType!.icon" class="input input-bordered input-xs w-full font-mono" placeholder="fa-solid fa-tags" />
                    <input type="color" [(ngModel)]="editType!.color" role="presentation"
                      class="w-8 h-7 cursor-pointer rounded border border-base-300 p-0.5 shrink-0"
                      aria-label="Color del tipo" />
                  </div>
                </td>
                <td>
                  <input [(ngModel)]="editType!.description" class="input input-bordered input-xs w-full" maxlength="255" />
                </td>
                <td class="text-center">
                  <div class="flex gap-2 justify-center">
                    <button class="btn btn-xs btn-ghost gap-1" (click)="cancelEdit()">
                      <i class="fa-solid fa-xmark text-sm" aria-hidden="true"></i>
                      Cancelar
                    </button>
                    <button class="btn btn-xs btn-primary gap-1" (click)="saveEdit()">
                      <i class="fa-solid fa-check text-sm" aria-hidden="true"></i>
                      Guardar
                    </button>
                  </div>
                </td>
              </ng-container>

              <!-- Fila solo lectura -->
              <ng-template #readonlyRow>
                <td>
                  <div class="flex items-center gap-2">
                    <div
                      class="p-1.5 rounded-lg shrink-0 flex items-center justify-center"
                      [style.background-color]="(t.color || '#2563EB') + '22'"
                      [style.color]="t.color || '#2563EB'"
                      aria-hidden="true"
                    >
                      <i [class]="t.icon || 'fa-solid fa-tags'" class="text-[15px]"></i>
                    </div>
                    <span
                      class="badge badge-sm gap-1.5 font-medium min-w-0 uppercase"
                      [style.background-color]="(t.color || '#2563EB') + '22'"
                      [style.color]="(t.color || '#2563EB') + '!important'"
                      [title]="t.name"
                    >
                      <span class="truncate">{{ t.name }}</span>
                    </span>
                  </div>
                </td>
                <td class="text-center">
                  <span class="inline-flex items-center gap-2">
                    <span
                      class="w-4 h-4 rounded-full border border-base-300 inline-block shrink-0"
                      [style.background]="t.color || '#2563EB'"
                    ></span>
                    <span class="font-mono text-xs opacity-70">{{
                      (t.color || '#2563EB').toUpperCase()
                    }}</span>
                  </span>
                </td>
                <td class="opacity-70 min-w-[12rem] max-w-xs">
                  <span class="line-clamp-2" [title]="t.description || ''">{{ t.description || '—' }}</span>
                </td>
                <td class="text-center">
                  <div class="flex gap-1 justify-center">
                    <button class="btn btn-ghost btn-xs gap-1" (click)="edit(t)" aria-label="Editar tipo">
                      <i class="fa-solid fa-pen text-sm" aria-hidden="true"></i>
                      Editar
                    </button>
                    <button class="btn btn-ghost btn-xs text-error gap-1" (click)="delete(t)" aria-label="Eliminar tipo">
                      <i class="fa-solid fa-trash text-sm" aria-hidden="true"></i>
                      Eliminar
                    </button>
                  </div>
                </td>
              </ng-template>
            </tr>

            <tr *ngIf="!types.length">
              <td colspan="4" class="text-center opacity-60 py-8">No hay tipos de ticket registrados</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
    <app-paginator
    [total]="types.length"
    [page]="pagTipos.page"
    [pageSize]="pagTipos.pageSize"
    (pageChange)="pagTipos.cambiarPagina($event)"
    (pageSizeChange)="pagTipos.cambiarTamano($event)"
    ></app-paginator>
</div>
