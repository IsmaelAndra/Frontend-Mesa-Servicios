<div class="space-y-6 w-full">
  <!-- ============================ HEADER ============================ -->
  <header
    class="page-head flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
  >
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="page-head__icono p-3 rounded-2xl bg-gradient-to-br from-primary/15 to-primary/5 text-primary shrink-0 ring-1 ring-primary/10"
        aria-hidden="true"
      >
        <i class="fa-solid fa-paintbrush text-2xl"></i>
      </div>
      <div class="min-w-0">
        <h1 class="page-head__titulo text-2xl sm:text-3xl font-bold text-primary leading-tight">
          Configuración de Marca
        </h1>
        <p class="text-sm opacity-70 truncate">
          Personaliza logo, iconos, imágenes y colores del sistema
        </p>
      </div>
    </div>
  </header>

  <!-- ============================ TABS ============================ -->
  <div
    class="inline-flex items-center gap-1 p-1 bg-base-200/60 rounded-xl border border-base-200"
  >
    <button
      *ngFor="let t of tabs"
      type="button"
      class="btn btn-sm gap-2 border-0 transition"
      [ngClass]="
        tab === t.id
          ? 'bg-base-100 shadow-sm text-primary font-semibold'
          : 'btn-ghost text-base-content/70 hover:text-primary'
      "
      (click)="tab = t.id"
      [attr.aria-selected]="tab === t.id"
      role="tab"
    >
      <i [class]="t.icon" aria-hidden="true"></i>
      {{ t.label }}
    </button>
  </div>

  <!-- ============================ TAB: LOGOS E ICONOS ============================ -->
  <app-branding-logos *ngIf="tab === 'logos'" class="grid grid-cols-1 xl:grid-cols-2 gap-5 items-start"></app-branding-logos>

  <!-- ============================ TAB: IMÁGENES ============================ -->
  <app-branding-imagenes *ngIf="tab === 'imagenes'" class="grid grid-cols-1 xl:grid-cols-2 gap-5 items-start"></app-branding-imagenes>

  <!-- ============================ TAB: COLORES ============================ -->
  <app-branding-colores *ngIf="tab === 'colores'" class="block space-y-5"></app-branding-colores>

  <!-- ============================ TAB: PANTALLA DE CARGA ============================ -->
  <app-branding-carga *ngIf="tab === 'carga'" class="block space-y-5"></app-branding-carga>
</div>
