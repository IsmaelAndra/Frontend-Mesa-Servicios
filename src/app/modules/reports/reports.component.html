<div class="space-y-6">
  <!-- Encabezado -->
  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="p-2.5 rounded-xl bg-primary/10 text-primary" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-primary">Reportes</h1>
        <p class="text-sm opacity-70">Genera y descarga reportes en distintos formatos</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button
        class="btn btn-sm btn-outline gap-2"
        (click)="loadReports()"
        [disabled]="loading"
        aria-label="Actualizar reportes"
      >
        <span *ngIf="loading" class="loading loading-spinner loading-xs" aria-hidden="true"></span>
        <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Actualizar
      </button>

      <span class="badge badge-ghost badge-sm">
        {{ filteredReports.length }} reporte{{ filteredReports.length === 1 ? '' : 's' }}
      </span>
    </div>
  </header>

  <!-- Barra de filtros -->
  <div class="card bg-base-100 shadow-sm border border-base-200">
    <div class="card-body p-3">
      <div class="flex flex-wrap gap-2 items-center">
        <!-- Búsqueda -->
        <label class="input input-bordered input-sm flex items-center gap-2 w-full sm:w-64">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            [(ngModel)]="search"
            class="grow bg-transparent outline-none"
            placeholder="Buscar reporte..."
            aria-label="Buscar reportes"
          />
        </label>

        <!-- Formato -->
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
          <select
            [(ngModel)]="format"
            class="select select-bordered select-sm pl-9 w-full sm:w-40"
            aria-label="Seleccionar formato de descarga"
          >
            <option value="PDF">📄 PDF</option>
            <option value="EXCEL">📊 Excel</option>
            <option value="HTML">🌐 HTML</option>
          </select>
        </div>

        <!-- Período -->
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <select
            [(ngModel)]="period"
            (ngModelChange)="applyPeriod()"
            class="select select-bordered select-sm pl-9 w-full sm:w-44"
            aria-label="Período del reporte"
          >
            <option value="HOY">Hoy</option>
            <option value="MES">Este mes</option>
            <option value="ANIO">Este año</option>
            <option value="SEMESTRE">Últimos 6 meses</option>
            <option value="PERSONALIZADO">Rango personalizado</option>
            <option value="TODO">Todo el historial</option>
          </select>
        </div>

        <!-- Rango personalizado -->
        <div *ngIf="period === 'PERSONALIZADO'" class="flex flex-wrap items-center gap-2">
          <input type="date" [(ngModel)]="fromDate" class="input input-bordered input-sm" aria-label="Desde" />
          <span class="text-xs opacity-60">a</span>
          <input type="date" [(ngModel)]="toDate" class="input input-bordered input-sm" aria-label="Hasta" />
        </div>

        <!-- Tipo de ticket -->
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5a2 2 0 011.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z" />
          </svg>
          <select
            [(ngModel)]="typeId"
            class="select select-bordered select-sm pl-9 w-full sm:w-44"
            aria-label="Tipo de ticket"
          >
            <option [ngValue]="undefined">Todos los tipos</option>
            <option *ngFor="let t of ticketTypes" [ngValue]="t.id">{{ t.name }}</option>
          </select>
        </div>

        <!-- Ordenamiento -->
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4" />
          </svg>
          <select
            [(ngModel)]="sortBy"
            class="select select-bordered select-sm pl-9 w-full sm:w-44"
            aria-label="Ordenar reportes"
          >
            <option value="label">Nombre (A-Z)</option>
            <option value="label-desc">Nombre (Z-A)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Estado de carga -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 gap-3" role="status" aria-live="polite">
    <span class="loading loading-spinner loading-lg text-primary" aria-hidden="true"></span>
    <span class="text-sm opacity-70">Cargando reportes...</span>
  </div>

  <!-- Estado vacío (sin reportes en absoluto) -->
  <div *ngIf="!loading && reports.length === 0" class="card bg-base-100 shadow-md border border-base-200">
    <div class="card-body">
      <div class="flex flex-col items-center justify-center py-12 gap-3 opacity-70">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="text-sm">No hay reportes disponibles</span>
      </div>
    </div>
  </div>

  <!-- Grid de reportes -->
  <div
    *ngIf="!loading && filteredReports.length > 0"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
  >
    <div
      *ngFor="let r of filteredReports"
      class="card bg-base-100 shadow-md hover:shadow-lg transition-all duration-200 border border-base-200 group"
    >
      <div class="card-body">
        <!-- Header de la tarjeta -->
        <div class="flex items-start gap-3">
          <div
            class="p-2 rounded-lg shrink-0 transition-colors"
            [ngClass]="getIconBg(r)"
            aria-hidden="true"
          >
            <ng-container [ngSwitch]="getReportIcon(r)">
              <!-- Ventas -->
              <svg *ngSwitchCase="'sales'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <!-- Usuarios -->
              <svg *ngSwitchCase="'users'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <!-- Tickets -->
              <svg *ngSwitchCase="'tickets'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
              </svg>
              <!-- SLA -->
              <svg *ngSwitchCase="'sla'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <!-- Inventario -->
              <svg *ngSwitchCase="'inventory'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <!-- Default -->
              <svg *ngSwitchDefault xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </ng-container>
          </div>

          <div class="flex-1 min-w-0">
            <h2 class="card-title text-base truncate" [title]="r.label">{{ r.label }}</h2>
            <p class="text-xs opacity-70 mt-1">Reporte JasperReports</p>
          </div>
        </div>

        <!-- Metadata -->
        <div class="flex flex-wrap items-center gap-2 mt-3">
          <span class="badge badge-sm badge-ghost gap-1">
            <ng-container [ngSwitch]="format">
              <span *ngSwitchCase="'PDF'" class="flex items-center gap-1">📄 PDF</span>
              <span *ngSwitchCase="'EXCEL'" class="flex items-center gap-1">📊 Excel</span>
              <span *ngSwitchCase="'HTML'" class="flex items-center gap-1">🌐 HTML</span>
            </ng-container>
          </span>
        </div>

        <!-- Acciones -->
        <div class="card-actions justify-end mt-3 pt-3 border-t border-base-200">
          <button
            class="btn btn-sm btn-primary gap-2"
            (click)="download(r.name, r.label)"
            [disabled]="downloading[r.label]"
            [attr.aria-label]="'Descargar reporte ' + r.label"
          >
            <span *ngIf="downloading[r.label]" class="loading loading-spinner loading-xs" aria-hidden="true"></span>
            <svg *ngIf="!downloading[r.label]" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            {{ downloading[r.label] ? 'Descargando...' : 'Descargar' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sin resultados de filtro -->
  <div
    *ngIf="!loading && reports.length > 0 && filteredReports.length === 0"
    class="card bg-base-100 shadow-md border border-base-200"
  >
    <div class="card-body">
      <div class="flex flex-col items-center justify-center py-12 gap-3 opacity-70">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <span class="text-sm">No se encontraron reportes con esos filtros</span>
        <button class="btn btn-sm btn-ghost gap-2 mt-1" (click)="search = ''">
          Limpiar búsqueda
        </button>
      </div>
    </div>
  </div>
</div>
