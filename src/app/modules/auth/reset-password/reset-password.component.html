<div class="min-h-screen flex items-center justify-center bg-base-200 px-4 py-10">
  <div class="w-full max-w-md">
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h1 class="card-title text-xl">Establecer nueva contraseña</h1>

        <!-- Enlace sin token: no tiene sentido enseñar el formulario -->
        <div *ngIf="sinToken" class="alert alert-warning mt-2">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          <span>
            El enlace no es válido. Pida uno nuevo desde la pantalla de acceso.
          </span>
        </div>

        <ng-container *ngIf="!sinToken">
          <p class="text-sm opacity-70 mt-1">
            Elija la contraseña con la que entrará en adelante. Al confirmarlo se
            cerrarán todas sus sesiones abiertas.
          </p>

          <form [formGroup]="form" (ngSubmit)="enviar()" class="flex flex-col gap-3 mt-4">
            <label class="form-control">
              <div class="label"><span class="label-text">Nueva contraseña</span></div>
              <input
                type="password"
                class="input input-bordered"
                formControlName="nuevaPassword"
                autocomplete="new-password"
                placeholder="Mínimo 8 caracteres"
              />
              <div
                *ngIf="form.get('nuevaPassword')?.touched && form.get('nuevaPassword')?.invalid"
                class="label"
              >
                <span class="label-text-alt text-error">
                  La contraseña debe tener al menos 8 caracteres
                </span>
              </div>
            </label>

            <label class="form-control">
              <div class="label"><span class="label-text">Repita la contraseña</span></div>
              <input
                type="password"
                class="input input-bordered"
                formControlName="repetirPassword"
                autocomplete="new-password"
              />
              <div *ngIf="contrasenasNoCoinciden" class="label">
                <span class="label-text-alt text-error">Las contraseñas no coinciden</span>
              </div>
            </label>

            <button
              type="submit"
              class="btn btn-primary mt-2"
              [disabled]="!puedeEnviar"
            >
              <span *ngIf="loading" class="loading loading-spinner loading-sm"></span>
              Guardar contraseña
            </button>
          </form>
        </ng-container>

        <div class="card-actions justify-end mt-4">
          <a routerLink="/auth/login" class="btn btn-ghost btn-sm">Volver al acceso</a>
        </div>
      </div>
    </div>
  </div>
</div>
