<div class="min-h-screen flex items-center justify-center p-4"
  [ngStyle]="{
    'background-image': backgroundUrl ? 'url(' + backgroundUrl + ')' : '',
    'background-size': 'cover',
    'background-position': 'center'
  }">
  <div class="w-full max-w-md space-y-6">
    <!-- Logo + título -->
    <div class="text-center space-y-3">
      <!-- Logo (si existe) -->
      <div class="flex justify-center">
        <img
          *ngIf="logoUrl"
          [src]="logoUrl"
          alt="Logo"
          class="h-14 w-auto object-contain"
        />
        <div
          *ngIf="!logoUrl"
          class="w-14 h-14 rounded-xl bg-primary flex items-center justify-center text-primary-content font-bold text-xl shadow-md"
          aria-hidden="true"
        >
          COAC
        </div>
      </div>

      <div>
        <h1 class="text-2xl font-bold text-primary">Mesa de Ayuda COAC</h1>
        <p class="text-sm opacity-70 mt-1">Ingresa a tu cuenta para continuar</p>
      </div>
    </div>

    <!-- Card del formulario -->
    <div class="card bg-base-100 shadow-xl border border-base-200">
      <div class="card-body p-6 sm:p-8">
        <h2 class="card-title justify-center text-xl mb-2">Iniciar sesión</h2>

        <form [formGroup]="form" (ngSubmit)="login()" class="space-y-4">
          <!-- Correo -->
          <label class="form-control w-full">
            <div class="label pt-0 pb-1">
              <span class="label-text text-xs font-medium">
                Correo corporativo <span class="text-error">*</span>
              </span>
            </div>
            <div class="relative">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <input
                type="email"
                formControlName="email"
                class="input input-bordered w-full pl-9"
                placeholder="usuario@coacmagisterio.fin.ec"
                autocomplete="email"
                [ngClass]="{
                  'input-error': form.get('email')?.invalid && form.get('email')?.touched
                }"
              />
            </div>
            <div
              *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
              class="label pt-1 pb-0"
            >
              <span class="label-text-alt text-error text-xs flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span *ngIf="form.get('email')?.errors?.['required']">El correo es obligatorio</span>
                <span *ngIf="form.get('email')?.errors?.['email']">Formato de correo inválido</span>
              </span>
            </div>
          </label>

          <!-- Contraseña -->
          <label class="form-control w-full">
            <div class="label pt-0 pb-1">
              <span class="label-text text-xs font-medium">
                Contraseña <span class="text-error">*</span>
              </span>
            </div>
            <div class="relative">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                class="input input-bordered w-full pl-9 pr-10"
                placeholder="••••••••"
                autocomplete="current-password"
                [ngClass]="{
                  'input-error': form.get('password')?.invalid && form.get('password')?.touched
                }"
              />
              <button
                type="button"
                class="btn btn-ghost btn-xs btn-circle absolute right-1 top-1/2 -translate-y-1/2 z-10"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              </button>
            </div>
            <div
              *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
              class="label pt-1 pb-0"
            >
              <span class="label-text-alt text-error text-xs flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                La contraseña es obligatoria
              </span>
            </div>
          </label>

          <!-- Botón login -->
          <div class="pt-2">
            <button
              type="submit"
              class="btn btn-primary w-full gap-2"
              [disabled]="loading || form.invalid"
            >
              <span *ngIf="loading" class="loading loading-spinner loading-xs" aria-hidden="true"></span>
              <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              {{ loading ? 'Ingresando...' : 'Ingresar' }}
            </button>
          </div>

          <!-- ¿Olvidaste tu contraseña? -->
          <div class="text-center -mt-1">
            <button
              type="button"
              class="btn btn-link btn-sm text-xs"
              (click)="forgotPassword()"
            >
              ¿Olvidó su contraseña?
            </button>
          </div>
        </form>

        <!-- Link registro -->
        <!-- <div class="divider text-xs opacity-60 my-4">¿No tienes cuenta?</div>

        <a
          routerLink="/auth/register"
          class="btn btn-outline btn-sm w-full gap-2"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
          Registrarse
        </a> -->
      </div>
    </div>

    <!-- Footer -->
    <!-- <p class="text-center text-xs opacity-60">
      © {{ currentYear }} COAC. Todos los derechos reservados.
    </p> -->
  </div>
</div>
