<div class="space-y-6">
  <!-- Encabezado -->
  <header class="page-head flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="page-head__icono p-2.5 rounded-xl bg-primary/10 text-primary" aria-hidden="true">
        <i class="fa-solid fa-table-columns text-2xl" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="page-head__titulo text-2xl sm:text-3xl font-bold text-primary">Actividades</h1>
        <p class="text-sm opacity-70">Tablero kanban de tareas asignadas</p>
      </div>
    </div>

    <button class="btn btn-primary btn-sm gap-2" (click)="openNew()">
      <i class="fa-solid fa-plus text-[15px]" aria-hidden="true"></i>
      Nueva tarea
    </button>
  </header>

  <!-- Cargando -->
  <app-skeleton *ngIf="loading" tipo="tarjetas" [cantidad]="4" etiqueta="Cargando actividades..."></app-skeleton>

  <!-- Tablero kanban -->
  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 min-h-[60vh]">
    <div *ngFor="let col of columns"
      class="rounded-xl bg-base-200/50 border border-base-200 flex flex-col max-h-[75vh] overflow-hidden">
      <!-- Header de columna -->
      <div class="px-3 py-2.5 bg-base-100 border-b border-base-200 flex items-center gap-2 shrink-0">
        <span class="w-2.5 h-2.5 rounded-full" [style.background]="col.color" aria-hidden="true"></span>
        <span class="font-semibold text-sm">{{ col.label }}</span>
        <span
          class="ml-auto text-xs font-medium opacity-70 bg-base-200 rounded-full px-2 py-0.5 min-w-[24px] text-center">
          {{ col.tasks.length }}
        </span>
      </div>

      <!-- Lista de tareas -->
      <div cdkDropList [id]="col.key" [cdkDropListData]="col.tasks" [cdkDropListConnectedTo]="columnIds"
        class="flex-1 overflow-y-auto p-2 space-y-2 kanban-list" (cdkDropListDropped)="drop($event)">
        <div *ngFor="let task of tareasVisibles(col)" cdkDrag (cdkDragStarted)="onDragStart()" (cdkDragEnded)="onDragEnd()"
          class="kanban-card bg-base-100 rounded-lg shadow-sm border border-base-200 border-l-4 p-3 cursor-grab active:cursor-grabbing hover:shadow-md transition group relative"
          [style.borderLeftColor]="col.color">
          <!-- Botón editar (aparece al hover) -->
          <button type="button"
            class="absolute top-2 right-2 btn btn-ghost btn-xs btn-square opacity-0 group-hover:opacity-100 transition-opacity z-10"
            (click)="openEdit(task); $event.stopPropagation()" aria-label="Editar tarea">
            <i class="fa-solid fa-pen text-sm" aria-hidden="true"></i>
          </button>

          <!-- Título -->
          <p class="text-sm font-medium leading-snug line-clamp-2 pr-6" [title]="task.title">
            {{ task.title }}
          </p>

          <!-- Descripción -->
          <p *ngIf="task.description" class="text-xs opacity-60 mt-1 line-clamp-2" [title]="task.description">
            {{ task.description }}
          </p>

          <!-- Footer con asignado y fecha -->
          <div class="flex items-center gap-2 mt-2 pt-2 border-t border-base-200 text-xs opacity-70 flex-wrap">
            <div class="flex items-center gap-1.5 min-w-0 flex-1 max-w-[55%]">
              <!-- Avatar con el punto de sesión del responsable -->
              <span class="relative shrink-0 w-5 h-5">
                <img
                  *ngIf="assignedPhoto(task)"
                  [src]="assignedPhoto(task)"
                  [alt]="asignado(task)"
                  class="w-5 h-5 rounded-full object-cover block"
                />
                <span
                  *ngIf="!assignedPhoto(task)"
                  class="w-5 h-5 rounded-full flex items-center justify-center"
                  [style.background]="col.color + '20'"
                  [style.color]="col.color"
                >
                  <span class="text-[10px] font-bold">
                    {{ (task.assignedUserEmail || '?').charAt(0).toUpperCase() }}
                  </span>
                </span>
                <app-presence-dot
                  class="absolute -bottom-0.5 -right-0.5"
                  [state]="sesionDe(task)"
                />
              </span>
              <span class="truncate text-[11px] leading-tight" [title]="task.assignedUserEmail">
                {{ asignado(task) }}
              </span>
            </div>

            <span *ngIf="task.start" class="badge badge-sm badge-ghost gap-1 shrink-0 font-mono"
              [title]="task.start | date: 'dd/MM/yyyy'">
              <i class="fa-regular fa-calendar text-xs" aria-hidden="true"></i>
              {{ task.start | date: 'dd MMM' }}
            </span>
          </div>
        </div>

        <!-- Estado vacío de columna -->
        <div *ngIf="!col.tasks.length"
          class="flex flex-col items-center justify-center gap-2 py-8 border-2 border-dashed border-base-300 rounded-lg opacity-50">
          <i class="fa-solid fa-clipboard text-3xl" aria-hidden="true"></i>
          <span class="text-xs">Sin tareas</span>
        </div>

        <!-- Hay más tarjetas de las que se pintan -->
        <div *ngIf="quedanOcultas(col) > 0" class="pt-1 space-y-1">
          <button type="button" class="btn btn-ghost btn-xs w-full"
            (click)="mostrarMas(col)">
            <i class="fa-solid fa-chevron-down text-[10px]" aria-hidden="true"></i>
            Ver {{ quedanOcultas(col) }} más
          </button>
          <button type="button" class="btn btn-ghost btn-xs w-full opacity-60"
            (click)="mostrarTodas(col)">
            Ver todas ({{ col.tasks.length }})
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
