<aside
  class="sb fixed md:relative top-0 left-0 h-screen app-chrome flex flex-col overflow-hidden"
  [class.sb--contraido]="contraido"
  [ngClass]="{
    'w-64': !isMobile && !collapsed,
    'w-[4.75rem]': contraido,
    'w-72': isMobile,
    '-translate-x-full': isMobile && !isOpen,
    'translate-x-0': !isMobile || isOpen
  }"
  [style.z-index]="isMobile ? '50' : 'auto'"
  aria-label="Menú principal"
>
  <!-- Adornos del tema de temporada: solo se ven con data-temporada (styles.css). -->
  <span class="temporada-cinta temporada-cinta--sb" aria-hidden="true"></span>

  <!-- ============ Marca ============ -->
  <div class="sb__marca">
    <a routerLink="/dashboard" class="relative flex items-center gap-3 min-w-0" aria-label="Ir al inicio">
      <span class="temporada-adorno temporada-adorno--sb" aria-hidden="true"></span>
      <span class="sb__logo">
        <img *ngIf="iconUrl || logoUrl" [src]="iconUrl || logoUrl" alt="Logo del sistema" class="w-full h-full object-contain" />
        <span *ngIf="!logoUrl && !iconUrl" class="font-bold text-sm">COAC</span>
      </span>
      <span class="sb__texto min-w-0">
        <span class="block font-bold text-[15px] text-white leading-tight whitespace-nowrap">Mesa de Servicios</span>
        <span class="block text-[10px] text-white/60 uppercase tracking-[0.14em] whitespace-nowrap">COAC Magisterio</span>
      </span>
    </a>

    <button
      *ngIf="isMobile"
      type="button"
      class="sb__icono-btn ml-auto"
      (click)="toggleSidebar()"
      aria-label="Cerrar menú"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <!-- ============ Búsqueda ============ -->
  <div class="px-3 pb-2 shrink-0">
    <button
      type="button"
      class="sb__buscar"
      (click)="abrirBusqueda()"
      (mouseenter)="mostrarEtiqueta($event, 'Buscar (Ctrl + K)')"
      (focus)="mostrarEtiqueta($event, 'Buscar (Ctrl + K)')"
      (mouseleave)="ocultarEtiqueta()"
      (blur)="ocultarEtiqueta()"
      aria-label="Buscar en la plataforma (Ctrl + K)"
    >
      <i class="fa-solid fa-magnifying-glass text-[13px] shrink-0" aria-hidden="true"></i>
      <span class="sb__texto flex-1 text-left">Buscar…</span>
      <kbd class="sb__texto sb__kbd">Ctrl K</kbd>
    </button>
  </div>

  <!-- ============ Navegación ============ -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 pb-3 sidebar-scroll">
    <section *ngFor="let sec of secciones; trackBy: trackSeccion" class="sb__seccion">
      <p class="sb__titulo">
        <span class="sb__texto">{{ sec.titulo }}</span>
      </p>

      <ul class="space-y-0.5">
        <li *ngFor="let item of sec.items; trackBy: trackItem">
          <!-- Enlace simple -->
          <a
            *ngIf="!item.children"
            [routerLink]="item.route"
            [fragment]="item.fragment || undefined"
            [queryParams]="item.queryParams || undefined"
            class="sb__link"
            [class.sb__link--activo]="isActive(item.route)"
            (mouseenter)="mostrarEtiqueta($event, item.label)"
            (focus)="mostrarEtiqueta($event, item.label)"
            (mouseleave)="ocultarEtiqueta()"
            (blur)="ocultarEtiqueta()"
            [attr.aria-current]="isActive(item.route) ? 'page' : null"
            [attr.aria-label]="contraido ? item.label : null"
          >
            <span class="sb__ico"><i [class]="item.icon" aria-hidden="true"></i></span>
            <span class="sb__texto truncate">{{ item.label }}</span>
          </a>

          <!-- Grupo con submenú -->
          <ng-container *ngIf="item.children">
            <button
              type="button"
              class="sb__link w-full"
              [class.sb__link--grupo-activo]="hasActiveChild(item)"
              [class.sb__link--flotante-abierto]="grupoFlotante?.item === item"
              [attr.aria-expanded]="contraido ? grupoFlotante?.item === item : !!item.expanded"
              [attr.aria-haspopup]="contraido ? 'menu' : null"
              [attr.aria-label]="contraido ? item.label : null"
              (click)="toggleChild(item, $event)"
              (mouseenter)="mostrarEtiqueta($event, item.label)"
              (focus)="mostrarEtiqueta($event, item.label)"
              (mouseleave)="ocultarEtiqueta()"
              (blur)="ocultarEtiqueta()"
            >
              <span class="sb__ico"><i [class]="item.icon" aria-hidden="true"></i></span>
              <span class="sb__texto truncate flex-1 text-left">{{ item.label }}</span>
              <i
                class="sb__texto fa-solid fa-chevron-down text-[10px] opacity-60 sb__flecha"
                [class.sb__flecha--abierta]="item.expanded"
                aria-hidden="true"
              ></i>
            </button>

            <!-- Despliegue animado: la fila pasa de 0fr a 1fr. -->
            <div class="sb__sub" [class.sb__sub--abierto]="item.expanded && !contraido">
              <ul class="sb__sub-lista">
                <ng-container *ngFor="let child of item.children; trackBy: trackItem">
                  <li *ngIf="isVisible(child)">
                    <a
                      [routerLink]="child.route"
                      class="sb__sublink"
                      [class.sb__sublink--activo]="isChildActive(child, item)"
                      [attr.aria-current]="isChildActive(child, item) ? 'page' : null"
                      [attr.tabindex]="item.expanded && !contraido ? null : -1"
                    >
                      <i [class]="child.icon" class="w-4 text-center text-[11px] opacity-80" aria-hidden="true"></i>
                      <span class="truncate">{{ child.label }}</span>
                    </a>
                  </li>
                </ng-container>
              </ul>
            </div>
          </ng-container>
        </li>
      </ul>
    </section>
  </nav>

  <!-- ============ Usuario ============ -->
  <div class="sb__pie">
    <div class="sb__usuario">
      <a
        routerLink="/settings/profile"
        class="flex items-center gap-3 min-w-0 flex-1"
        (mouseenter)="mostrarEtiqueta($event, displayName)"
        (focus)="mostrarEtiqueta($event, displayName)"
        (mouseleave)="ocultarEtiqueta()"
        (blur)="ocultarEtiqueta()"
        aria-label="Mi perfil"
      >
        <span class="relative shrink-0">
          <img
            *ngIf="photoSrc"
            [src]="photoSrc"
            [alt]="displayName || 'Foto de perfil'"
            class="w-9 h-9 rounded-xl object-cover ring-2 ring-white/20"
          />
          <span
            *ngIf="!photoSrc"
            class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center text-white font-semibold text-sm"
          >{{ initials }}</span>
          <span
            class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full ring-2 ring-[#0b1f45]"
            [ngClass]="sesionDot"
            [attr.aria-label]="'Sesión: ' + sesionLabel"
            role="img"
          ></span>
        </span>
        <span class="sb__texto min-w-0">
          <span class="block text-sm font-medium text-white truncate">{{ displayName }}</span>
          <span class="block text-[10px] uppercase tracking-wide text-white/60 truncate">{{ roleLabel }}</span>
        </span>
      </a>

      <button
        type="button"
        class="sb__icono-btn sb__salir shrink-0"
        (click)="logout()"
        (mouseenter)="mostrarEtiqueta($event, 'Cerrar sesión', true)"
        (focus)="mostrarEtiqueta($event, 'Cerrar sesión', true)"
        (mouseleave)="ocultarEtiqueta()"
        (blur)="ocultarEtiqueta()"
        aria-label="Cerrar sesión"
      >
        <i class="fa-solid fa-right-from-bracket text-[13px]" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</aside>

<!--
  Etiqueta y submenú del menú contraído. Van FUERA del <aside>: el aside tiene
  overflow hidden (para cerrar su ancho al contraer) y recortaba los tooltips,
  que salían por la derecha; solo se veía la punta de la flecha.
-->
<div
  *ngIf="flotante"
  class="sb-etiqueta"
  [style.top.px]="flotante.top"
  [style.left.px]="flotante.left"
  role="tooltip"
>{{ flotante.texto }}</div>

<div
  *ngIf="grupoFlotante as g"
  class="sb-flyout"
  [style.top.px]="g.top"
  [style.left.px]="g.left"
  role="menu"
  [attr.aria-label]="g.item.label"
>
  <p class="sb-flyout__titulo">
    <i [class]="g.item.icon" aria-hidden="true"></i>
    {{ g.item.label }}
  </p>
  <ng-container *ngFor="let child of g.item.children; trackBy: trackItem">
    <a
      *ngIf="isVisible(child)"
      [routerLink]="child.route"
      class="sb-flyout__link"
      [class.sb-flyout__link--activo]="isChildActive(child, g.item)"
      [attr.aria-current]="isChildActive(child, g.item) ? 'page' : null"
      role="menuitem"
      (click)="cerrarGrupoFlotante()"
    >
      <i [class]="child.icon" class="w-4 text-center text-[12px] opacity-80" aria-hidden="true"></i>
      <span class="truncate">{{ child.label }}</span>
    </a>
  </ng-container>
</div>

<!-- Fondo del menú en el móvil -->
<div
  *ngIf="isMobile && isOpen"
  class="overlay-backdrop fixed inset-0 bg-black/50 z-40"
  (click)="toggleSidebar()"
  aria-hidden="true"
></div>
