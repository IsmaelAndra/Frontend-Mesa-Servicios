<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mesa de Servicios COAC</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="assets/tema.js"></script>
<!-- Un solo <link rel="icon">: el navegador toma el primero valido, asi que
           declarar el PNG antes hacia que la pestana mostrara ese y no favicon.ico. -->
      <link rel="icon" href="favicon.ico?v=2" sizes="any" />
      <link rel="manifest" href="assets/manifest.webmanifest?v=2" />
      <meta name="theme-color" content="#062e86" />
      <meta name="description" content="Mesa de Ayuda COAC: registro y seguimiento de tickets de soporte." />
      <!-- iOS no lee el manifest, asi que el icono de la pantalla de inicio se
           declara aparte. -->
      <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2" />
  </head>
  <body class="bg-base-200 min-h-screen">
    <!-- Mientras baja el JavaScript se ve esto (antes, una pantalla en blanco).
         Angular lo reemplaza al arrancar por la pantalla de carga de Marca, que
         usa el mismo fondo, así que el paso no se nota. Estilos en styles.css. -->
    <app-root><div class="arranque" role="status" aria-label="Cargando"><span class="arranque__giro"></span></div></app-root>
  </body>
</html>
