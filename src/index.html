<!-- Un solo <link rel="icon">: el navegador toma el primero valido, asi que
           declarar el PNG antes hacia que la pestana mostrara ese y no favicon.ico. -->
      <link rel="icon" href="favicon.ico" sizes="any" />
      <link rel="manifest" href="assets/manifest.webmanifest" />
      <meta name="theme-color" content="#062e86" />
      <meta name="description" content="Mesa de Ayuda COAC: registro y seguimiento de tickets de soporte." />
      <!-- iOS no lee el manifest, asi que el icono de la pantalla de inicio se
           declara aparte. -->
      <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  </head>
  <body class="bg-base-200 min-h-screen">
    <app-root></app-root>
  </body>
