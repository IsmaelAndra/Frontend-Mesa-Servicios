# ==============================================================================
# Nginx del frontend Mesa de Servicios COAC
# ==============================================================================
# Sirve el build de Angular y reenvía /api al backend. Para el navegador es UN
# solo origen, por eso environment.prod.ts usa apiUrl: '/api' y no hace falta
# CORS.
#
# Es una PLANTILLA: el Dockerfile la copia a /etc/nginx/templates/ y la imagen
# nginx-unprivileged (sin root, puerto 8080 del contenedor) la pasa por envsubst
# al arrancar. Solo se sustituyen variables de entorno que existan; las de nginx
# ($host, $remote_addr...) no son variables de entorno y quedan tal cual.
#   ${REAL_IP_FROM}  red desde la que llega el proxy del servidor (por defecto
#                    172.16.0.0/12, las redes de Docker).
#
# TLS: este contenedor habla HTTP y no publica puertos. El HTTPS y los puertos
# 80/443 los tiene el Nginx propio del servidor, que llega a este contenedor por
# una red de Docker compartida (ver despliegue/README.md en el backend).
# ==============================================================================

# ---------- Cabeceras de seguridad solo para la SPA ----------
# Las respuestas de /api ya traen las suyas desde Spring (CSP default-src 'none',
# nosniff…). Si nginx añadiera también estas, saldrían duplicadas. add_header no
# envía la cabecera cuando el valor queda vacío, así que en /api se vacían.
map $uri $mesa_es_api {
    ~^/api(/|$)  1;
    default      0;
}

# CSP recomendada en el README. images.unsplash.com: portada por defecto del
# perfil (profile.component.ts) mientras no se suba una propia en branding.
# media-src blob: los sonidos de notificación se descargan con la sesión y se
# reproducen como blob; sin esta directiva caía en default-src y no sonaban.
map $mesa_es_api $mesa_csp {
    1       "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
map $mesa_es_api $mesa_nosniff   { 1 ""; default "nosniff"; }
map $mesa_es_api $mesa_frame     { 1 ""; default "DENY"; }
map $mesa_es_api $mesa_referrer  { 1 ""; default "strict-origin-when-cross-origin"; }
map $mesa_es_api $mesa_permisos  { 1 ""; default "camera=(), microphone=(), geolocation=(), payment=()"; }

# Protocolo original: si delante hay un proxy TLS, este manda
# X-Forwarded-Proto: https; si no, es el de esta conexión.
map $http_x_forwarded_proto $mesa_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Igual que spring.servlet.multipart.max-request-size (50 MB por petición).
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log off;
    error_log /dev/stderr warn;

    add_header Content-Security-Policy $mesa_csp always;
    add_header X-Content-Type-Options  $mesa_nosniff always;
    add_header X-Frame-Options         $mesa_frame always;
    add_header Referrer-Policy         $mesa_referrer always;
    add_header Permissions-Policy      $mesa_permisos always;
    # HSTS (informe de ZAP): el navegador recordará un año que este sitio va
    # solo por HTTPS. Sin includeSubDomains para no afectar a otros subdominios
    # de la institución. Por HTTP plano (instalación de pruebas) se ignora.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- IP real del cliente ----------
    # Delante está el Nginx del servidor: sin esto, $remote_addr sería la IP de
    # ese proxy y todos los usuarios compartirían un mismo límite de intentos de
    # login. Se confía en X-Forwarded-For SOLO si la conexión viene de la red de
    # Docker (REAL_IP_FROM): este contenedor no publica puertos, así que el único
    # que llega desde ahí es el proxy. Con real_ip_recursive se toma la IP más a
    # la derecha que no sea de esa red: aunque un cliente mande su propio
    # X-Forwarded-For inventado, no sirve (el proxy añade la real detrás).
    set_real_ip_from  ${REAL_IP_FROM};
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Al backend se le pasa una sola IP, ya resuelta: la toma del PRIMER valor de
    # X-Forwarded-For (ClientIpFilter). Se SOBRESCRIBE, nunca se reenvía la que
    # mande el cliente.

    # ---------- API ----------
    # Con una variable, nginx vuelve a resolver "backend" en el DNS de Docker:
    # al recrear el contenedor del backend cambia su IP y no hace falta
    # reiniciar este.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mesa_backend http://backend:8080;

    # $http_host y no $host: $host pierde el puerto, y el backend arma con él las
    # URL absolutas de logo y fondos. Con HTTP_PORT=8088 salía
    # http://servidor/api/... (puerto 80) y la imagen no cargaba.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $mesa_proto;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Forwarded         "";

    # ^~ para que las expresiones regulares de abajo (archivos con hash) no se
    # queden con rutas de la API como /api/uploads/publico/<uuid>.png.
    location ^~ /api/ {
        proxy_pass $mesa_backend;
        # Informes PDF y llamadas a NEXA pueden tardar hasta un minuto.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Eventos en vivo (SSE). Sin búfer, o los avisos llegarían a trozos; y con
    # un tiempo de lectura largo, porque la conexión queda abierta (el backend
    # manda un latido periódico).
    location = /api/events {
        proxy_pass $mesa_backend;
        proxy_buffering off;
        # Nginx no reenvía las cabeceras X-Accel-* del backend. Sin esta línea,
        # el "X-Accel-Buffering: no" se quedaba aquí y el Nginx del servidor
        # (coac-ti-proxy, sin proxy_buffering off) retenía el canal: el chat no
        # llegaba en vivo. Así cualquier proxy de delante deja de usar búfer.
        proxy_pass_header X-Accel-Buffering;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ---------- Aplicación Angular ----------
    # index.html nunca se cachea: es el que apunta a los .js de la versión
    # actual. Tras una actualización, el navegador lo pide de nuevo y carga
    # los archivos nuevos.
    location = /index.html {
        expires -1;
    }

    # Archivos con hash en el nombre (main.3f2a…js, styles.…css, fuentes):
    # un cambio genera otro nombre, así que pueden cachearse un año.
    location ~* "\.[0-9a-f]{16,}\.[a-z0-9]+$" {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # src/assets: sin hash en el nombre, caché corta.
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # Rutas del router (/tickets/…, /404, /admin/…): todas sirven index.html
    # y Angular decide qué pintar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
